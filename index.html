<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="theme-color" content="#120f1c"><meta name="description" content="등불나무 아래 — 아기자기한 픽셀 생존·건축·농사 게임"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="등불나무"><link rel="apple-touch-icon" href="icon-180.png"><link rel="icon" type="image/png" href="icon-192.png"><link rel="manifest" href="manifest.webmanifest"><title>등불나무 아래</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
<style>
/* Layout: full-bleed pixel canvas; HUD floats top-left, menu column top-right, hotbar + big action button at the thumb zone. One dark lantern-lit look. */
:root{
  --bg:#120f1c; --ink:#1b1426; --panel:#2a2139; --panel2:#352a48; --slot:#3a2e50; --line:#57476e;
  --text:#fbefd9; --muted:#bfaed3; --amber:#ffc861; --amber-d:#d9902f; --mint:#7fe0b5;
  --rose:#ff8fa3; --hunger:#ffb15c; --danger:#ff7a8a;
  --font:'Jua','Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',system-ui,sans-serif;
  --slotS:clamp(46px, calc((100vw - 88px) / 6), 60px);
  color-scheme:dark;
}
html,body{height:100%;background:var(--bg);color:var(--text)}
body{margin:0;overflow:hidden;font-family:var(--font);word-break:keep-all;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;overscroll-behavior:none}
button{font-family:var(--font);color:var(--text);cursor:pointer;-webkit-tap-highlight-color:transparent}
button:focus-visible{outline:3px solid var(--amber);outline-offset:2px}
[hidden]{display:none!important}
img.px{image-rendering:pixelated;image-rendering:crisp-edges}
#game{position:fixed;inset:0;overflow:hidden;background:var(--bg)}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
#vig{position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse at center,rgba(10,6,18,0) 55%,rgba(10,6,18,.5) 100%)}

/* HUD */
#hud{position:absolute;top:0;left:0;right:0;display:flex;justify-content:space-between;align-items:flex-start;gap:12px;
  padding:calc(env(safe-area-inset-top,0px) + 12px) calc(env(safe-area-inset-right,0px) + 14px) 0 calc(env(safe-area-inset-left,0px) + 14px);pointer-events:none}
#hud > *{pointer-events:auto}
.bars{display:grid;gap:6px;width:min(250px,60vw)}
.bar{display:flex;align-items:center;gap:6px;background:rgba(27,20,38,.78);border:2px solid var(--line);border-radius:14px;padding:3px 9px 3px 3px}
.bar img{width:28px;height:28px;flex:none}
.track{flex:1;height:12px;background:#140f1d;border-radius:7px;overflow:hidden;box-shadow:inset 0 2px 0 rgba(0,0,0,.35)}
.fill{height:100%;width:100%;border-radius:7px;transition:width .2s}
.hp .fill{background:linear-gradient(#ffb0bf,var(--rose) 45%,#e0647d)}
.hu .fill{background:linear-gradient(#ffd59a,var(--hunger) 45%,#e08a3a)}
.bar span{font-size:15px;min-width:30px;text-align:right;font-variant-numeric:tabular-nums}
.goal{display:flex;flex-direction:column;align-items:flex-start;gap:2px;text-align:left;background:rgba(42,33,57,.9);border:2px solid #6c5585;border-radius:14px;padding:6px 11px 7px;font-size:15px;line-height:1.3;min-width:0}
.goal b{font-weight:400;font-size:12px;letter-spacing:.06em;color:var(--amber)}
.side{display:grid;gap:8px}
.sbtn{width:58px;height:58px;border-radius:17px;background:rgba(42,33,57,.92);border:2px solid var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;font-size:12px;padding:0;box-shadow:0 3px 0 rgba(0,0,0,.35)}
.sbtn img{width:30px;height:30px}
.sbtn:active{transform:translateY(2px);box-shadow:none}

#bossbar{background:rgba(27,20,38,.85);border:2px solid #8c4a5e;border-radius:14px;padding:6px 10px 8px}
#bossbar .bn{font-size:14px;color:#ffc2cf;margin-bottom:4px}
#bossbar .fill{background:linear-gradient(#ffd0a0,#ff7a5c)}

#toasts{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + var(--slotS) + 240px);display:flex;flex-direction:column;align-items:center;gap:6px;pointer-events:none;width:min(92vw,420px)}
.toast{background:rgba(27,20,38,.92);border:2px solid var(--amber-d);border-radius:999px;padding:7px 16px;font-size:15px;text-align:center;animation:tin .25s ease-out;text-wrap:balance}
.toast.good{border-color:var(--mint)}
.toast.warn{border-color:#ff8a96;background:#4a1f2e;color:#ffe0e5}
.toast.out{opacity:0;transform:translateY(6px);transition:all .3s}
@media (pointer:fine){#toasts{bottom:calc(var(--slotS) + 60px)}}
@keyframes tin{from{opacity:0;transform:translateY(8px) scale(.96)}}

/* Hotbar */
#hotbar{position:absolute;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 12px);transform:translateX(-50%);display:flex;gap:8px;padding:8px;background:rgba(27,20,38,.82);border:2px solid var(--line);border-radius:20px}
.slot{width:var(--slotS);height:var(--slotS);border-radius:13px;background:var(--slot);border:2px solid #4d3e66;position:relative;display:grid;place-items:center;padding:0;box-shadow:inset 0 -3px 0 rgba(0,0,0,.25)}
.slot img{width:70%;height:70%;object-fit:contain}
.slot .dur{position:absolute;left:7px;right:7px;bottom:5px;height:4px;background:#140f1d;border-radius:2px;overflow:hidden}
.slot .dur i{display:block;height:100%}
.slot.broken img{filter:grayscale(1);opacity:.45}
.slot .brk{position:absolute;top:2px;right:5px;font-size:15px;color:#ff6b7a;text-shadow:0 1px 0 #000}
.slot .cnt{position:absolute;right:5px;bottom:2px;font-size:14px;text-shadow:0 1px 0 #000,1px 0 0 #000,-1px 0 0 #000,0 -1px 0 #000}
.slot .key{position:absolute;left:6px;top:2px;font-size:11px;color:var(--muted)}
.slot.sel{border-color:var(--amber);background:#4b3a63;box-shadow:0 0 0 2px rgba(255,200,97,.35),inset 0 -3px 0 rgba(0,0,0,.25)}
.slot.pick{border-color:var(--mint);background:#3c4a55}

/* Touch controls */
#subBtn{position:absolute;right:calc(env(safe-area-inset-right,0px) + 36px);bottom:calc(env(safe-area-inset-bottom,0px) + var(--slotS) + 160px);width:64px;height:64px;border-radius:50%;
  background:radial-gradient(circle at 50% 35%,#4b3c63,#2f2440 70%);border:3px solid #8a7aa6;box-shadow:0 4px 0 rgba(0,0,0,.4);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0;padding:0;touch-action:none}
#subBtn img{width:26px;height:26px}
#subBtn span{font-size:13px}
#subBtn:active{transform:translateY(2px);box-shadow:none}
body:not(.touch) #subBtn, body.intro #subBtn{display:none}
#fade.sleep{color:var(--amber);background:rgba(14,10,30,.9)}
#actBtn{position:absolute;right:calc(env(safe-area-inset-right,0px) + 18px);bottom:calc(env(safe-area-inset-bottom,0px) + var(--slotS) + 48px);width:100px;height:100px;border-radius:50%;
  background:radial-gradient(circle at 50% 35%,#5a4774,#3a2c52 70%);border:3px solid var(--amber);box-shadow:0 5px 0 rgba(0,0,0,.4),0 0 24px rgba(255,200,97,.25);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:0;touch-action:none}
#actBtn img{width:44px;height:44px}
#actBtn span{font-size:15px}
#actBtn.on{transform:translateY(3px) scale(.96);box-shadow:0 2px 0 rgba(0,0,0,.4),0 0 30px rgba(255,200,97,.45)}
.joy{position:absolute;width:128px;height:128px;margin:-64px 0 0 -64px;border-radius:50%;border:3px solid rgba(255,241,214,.35);background:rgba(27,20,38,.35);pointer-events:none;opacity:.55;transition:opacity .15s}
.joy.on{opacity:.95}
.joy i{position:absolute;left:50%;top:50%;width:56px;height:56px;margin:-28px 0 0 -28px;border-radius:50%;background:radial-gradient(circle at 40% 35%,#fff1d6,#d9c3a3);box-shadow:0 3px 0 rgba(0,0,0,.35)}
body:not(.touch) #actBtn, body:not(.touch) .joy{display:none}
body.intro #hud, body.intro #hotbar, body.intro #actBtn, body.intro .joy, body.intro #pcHint, body.intro #toasts{display:none}
#pcHint{position:absolute;left:14px;bottom:14px;font-size:13px;color:var(--muted);background:rgba(27,20,38,.75);border-radius:12px;padding:8px 12px;line-height:1.6;max-width:260px}
body.touch #pcHint{display:none}
@media (max-width:900px){#pcHint{display:none}}

/* Sheet panels */
#sheetWrap{position:absolute;inset:0;z-index:20}
.backdrop{position:absolute;inset:0;background:rgba(10,7,16,.55)}
.sheet{position:absolute;left:50%;bottom:0;transform:translateX(-50%);width:min(100%,620px);max-height:86%;display:flex;flex-direction:column;background:var(--panel);
  border:2px solid var(--line);border-bottom:0;border-radius:26px 26px 0 0;padding:14px 16px calc(16px + env(safe-area-inset-bottom,0px));box-sizing:border-box;animation:sup .22s ease-out}
@keyframes sup{from{transform:translate(-50%,30px);opacity:0}}
@media (min-width:760px) and (min-height:640px){.sheet{bottom:auto;top:50%;transform:translate(-50%,-50%);border-radius:26px;border-bottom:2px solid var(--line);max-height:84%;animation:none}}
.sh-head{flex:none;display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px}
.sh-head h2{margin:0;font-weight:400;font-size:24px;display:flex;align-items:center;gap:8px}
.sh-head h2 img{width:32px;height:32px}
.xbtn{width:50px;height:50px;border-radius:15px;background:var(--panel2);border:2px solid var(--line);font-size:22px;padding:0}
.sh-body{overflow-y:auto;overflow-x:hidden;flex:1;min-height:0;-webkit-overflow-scrolling:touch;touch-action:pan-y;padding-bottom:4px}
.lbl{font-size:13px;color:var(--muted);margin:10px 2px 6px;letter-spacing:.04em}
.grid{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:8px}
.grid .slot{width:100%;height:auto;aspect-ratio:1}
.hint{flex:none;font-size:14px;color:var(--muted);line-height:1.5;margin:2px 2px 8px}
.detail{display:grid;grid-template-columns:60px 1fr;gap:12px;align-items:center;background:var(--panel2);border-radius:18px;padding:12px;margin-top:12px}
.detail img{width:56px;height:56px}
.detail h3{margin:0 0 3px;font-weight:400;font-size:19px}
.detail p{margin:0;font-size:14px;color:var(--muted);line-height:1.45}
.detail .st{color:var(--amber);font-size:14px;margin-top:3px}
.btns{display:flex;flex-wrap:wrap;gap:8px;grid-column:1/-1}
.btn{min-height:48px;padding:0 18px;border-radius:15px;border:0;background:var(--amber);color:#3a2410;font-size:17px;box-shadow:0 3px 0 var(--amber-d)}
.btn.ghost{background:var(--panel);color:var(--text);box-shadow:0 3px 0 #1b1426;border:2px solid var(--line)}
.btn.warn{background:#ff8a96;color:#3a1018;box-shadow:0 3px 0 #c4505f}
.btn:disabled{background:#4d3e66;color:var(--muted);box-shadow:none}
.btn:active:not(:disabled){transform:translateY(2px);box-shadow:none}
.tabs{flex:none;display:flex;gap:6px;overflow-x:auto;padding-bottom:6px;margin-bottom:6px;touch-action:pan-x}
.tab{flex:none;height:42px;padding:0 15px;border-radius:13px;background:var(--panel2);border:2px solid transparent;font-size:16px}
.tab.on{border-color:var(--amber);background:#4b3a63}
.stations{flex:none;display:flex;flex-wrap:wrap;gap:6px;margin:0 0 10px}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:13px;padding:4px 10px;border-radius:999px;background:#1f182c;color:var(--muted)}
.chip.on{background:#2f4a3f;color:#c9f5df}
.list{display:grid;gap:8px}
.qty{grid-column:2/-1;display:flex;align-items:center;gap:8px;margin-top:-2px}
.qty button{min-width:40px;height:38px;border-radius:12px;border:2px solid var(--line);background:var(--panel);color:var(--text);font:inherit;font-size:20px;line-height:1;padding:0 8px}
.qty button.qmax{font-size:14px;min-width:52px}
.qty button:disabled{opacity:.35}
.qty b{font-weight:400;min-width:44px;text-align:center;font-size:16px;color:var(--amber)}
.ing.gain{color:#9fe8c4}
.fixbar{height:6px;background:#140f1d;border-radius:3px;overflow:hidden;margin:6px 0 2px;max-width:160px}
.fixbar i{display:block;height:100%;background:linear-gradient(90deg,#ff6b7a,#ffc861 40%,#7fe0b5)}
.rc{display:grid;grid-template-columns:56px 1fr auto;gap:12px;align-items:center;padding:10px;background:var(--panel2);border-radius:18px;border:2px solid transparent}
.rc.ok{border-color:#6a557f}
.rc.no .ri,.rc.no .rn{opacity:.55}
.ri{width:56px;height:56px;border-radius:14px;background:var(--slot);display:grid;place-items:center}
.ri img{width:40px;height:40px;object-fit:contain}
.rn{font-size:17px;min-width:0}
.rn small{color:var(--muted);font-size:13px;margin-left:4px}
.ings{display:flex;flex-wrap:wrap;gap:4px;margin-top:5px}
.ing{display:inline-flex;align-items:center;gap:3px;padding:2px 8px 2px 4px;background:#241c33;border-radius:10px;font-size:14px;font-variant-numeric:tabular-nums}
.ing img{width:20px;height:20px}
.ing.short{color:var(--danger)}
.at{font-size:12px;color:#ffb4c0;margin-top:4px}
.mk{min-width:76px}
#mapCv{width:100%;aspect-ratio:1;border-radius:16px;background:#0c0a12;display:block;image-rendering:pixelated}
.legend{display:flex;flex-wrap:wrap;gap:6px 12px;font-size:13px;color:var(--muted);margin-top:10px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:5px;vertical-align:-1px}
.seeds{display:flex;gap:14px;justify-content:center;margin:12px 0 16px}
.seeds div{width:76px;height:76px;border-radius:22px;background:var(--panel2);display:grid;place-items:center;border:2px solid var(--line)}
.seeds div.lit{border-color:var(--amber);box-shadow:0 0 22px rgba(255,200,97,.4)}
.seeds img{width:52px;height:52px}
.seeds div:not(.lit) img{opacity:.25;filter:grayscale(1)}
.prose{font-size:15px;line-height:1.65;color:var(--text);margin:0 0 12px}
.prose em{font-style:normal;color:var(--amber)}
.keys{display:grid;grid-template-columns:auto 1fr;gap:6px 12px;font-size:14px;color:var(--muted);margin:6px 0 14px}
.keys b{font-weight:400;color:var(--text)}
.menu-list{display:grid;gap:10px}
.menu-two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.impbox{background:var(--panel2);border:2px solid var(--amber);border-radius:18px;padding:14px;margin:0 0 14px}
.impbox p{margin:0 0 12px;font-size:15px;line-height:1.55}
.devbox{border:2px dashed #ff8fa3;border-radius:18px;padding:12px;margin-top:16px}
.markrow{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:6px 2px;font-size:15px;border-bottom:1px solid var(--line)}
.markrow .btn{min-height:40px;padding:0 12px;font-size:14px}
#saveWarn{font-size:14px;line-height:1.5;color:#ffb4c0;background:rgba(60,20,34,.85);border:2px solid #ff8a96;border-radius:14px;padding:10px}
#bkList{width:min(340px,100%);background:rgba(27,20,38,.95);border:2px solid var(--line);border-radius:18px;padding:12px;display:grid;gap:8px;text-align:left}
#bkList .bk{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:15px}
#bkList .bk .btn{min-height:42px;font-size:15px;padding:0 12px}
#cloudAsk{width:min(340px,100%);background:rgba(27,20,38,.92);border:2px solid var(--mint);border-radius:18px;padding:14px;text-align:center}
#cloudAsk p{margin:0 0 12px;font-size:16px;line-height:1.5}
.cl-form{display:grid;gap:8px;margin-top:10px}
.cl-form input{font:inherit;font-size:16px;padding:12px 14px;border-radius:14px;border:2px solid var(--line);background:var(--panel);color:var(--text);-webkit-user-select:text;user-select:text;touch-action:manipulation}
#impAsk{width:min(320px,100%);background:rgba(27,20,38,.92);border:2px solid var(--amber);border-radius:18px;padding:14px;text-align:center}
#impAsk p{margin:0 0 12px;font-size:16px;line-height:1.5}
.menu-list .btn{width:100%}

/* Title */
#title{position:absolute;inset:0;z-index:30;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;text-align:center;
  padding:calc(env(safe-area-inset-top,0px) + 24px) 20px calc(env(safe-area-inset-bottom,0px) + 24px);background:radial-gradient(ellipse at 50% 40%,rgba(18,15,28,.25),rgba(18,15,28,.88) 70%)}
#title .logo{font-size:clamp(44px,13vw,76px);line-height:1;color:var(--amber);text-shadow:0 4px 0 #6b3d16,0 0 40px rgba(255,200,97,.35);letter-spacing:.02em;text-wrap:balance}
#title .sub{font-size:16px;color:var(--mint);letter-spacing:.12em}
#title .story{font-size:16px;line-height:1.7;max-width:22em;color:var(--text);background:rgba(27,20,38,.72);border-radius:18px;padding:12px 18px;text-wrap:balance}
#title .tb{display:grid;gap:10px;width:min(320px,100%)}
#title.picking>*:not(#charPick){display:none!important}
#charPick{width:min(360px,100%);display:grid;gap:14px}
.cp-h{font-size:24px;color:var(--amber)}
.cp-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:10px}
.cp-card{background:var(--panel);border:2px solid var(--line);border-radius:18px;padding:8px 4px 6px;color:var(--text);font:inherit;font-size:16px;display:grid;justify-items:center;gap:2px;cursor:pointer}
.cp-card img{width:64px;height:76px}
.cp-card.on{border-color:var(--amber);background:var(--panel2);box-shadow:0 0 18px rgba(255,200,97,.3)}
.cp-desc{min-height:22px;font-size:16px;color:var(--muted)}
.sh-body .cp-grid{margin-top:4px}
.look-prev{flex:none;display:flex;justify-content:center;gap:18px;background:var(--panel2);border-radius:18px;padding:10px;margin-bottom:10px}
.look-prev img{width:64px;height:76px}
.look-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:8px}
.look-opt{background:var(--panel);border:2px solid var(--line);border-radius:16px;padding:8px 4px 6px;color:var(--text);font:inherit;font-size:14px;display:grid;justify-items:center;gap:4px;min-height:64px}
.look-opt img{width:48px;height:57px}
.look-opt.on{border-color:var(--amber);background:var(--panel2)}
.look-opt .sw{display:block;width:34px;height:34px;border-radius:50%;border:2px solid #241b2f}
#title .btn{min-height:58px;font-size:20px}
#title .ver{font-size:12px;color:var(--muted)}
#fade{position:absolute;inset:0;z-index:25;background:rgba(14,10,22,.8);display:grid;place-items:center;font-size:24px;color:var(--rose);text-align:center;padding:20px}
@media (max-height:520px){.side{grid-auto-flow:column}.goal{max-width:46vw}}
@media (prefers-reduced-motion:reduce){.toast,.sheet{animation:none}.fill{transition:none}}
</style>

<script>if('serviceWorker' in navigator&&location.protocol==='https:')addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));</script></head><body><div id="game">
  <canvas id="cv" aria-label="게임 화면"></canvas><div id="vig"></div>
  <div id="hud">
    <div class="bars">
      <div class="bar hp" title="체력"><img class="px" id="icHp" alt="체력"><div class="track"><div class="fill" id="hpFill"></div></div><span id="hpTxt">100</span></div>
      <div class="bar hu" title="포만감"><img class="px" id="icHu" alt="포만감"><div class="track"><div class="fill" id="huFill"></div></div><span id="huTxt">100</span></div>
      <button class="goal" id="goal" type="button"><b>지금 할 일</b><span id="goalTxt">…</span></button>
      <div id="bossbar" hidden><div class="bn">말랑대왕</div><div class="track"><div class="fill" id="bossFill"></div></div></div>
    </div>
    <div class="side">
      <button class="sbtn" id="bInv" type="button"><img class="px" alt="">가방</button>
      <button class="sbtn" id="bCraft" type="button"><img class="px" alt="">제작</button>
      <button class="sbtn" id="bMap" type="button"><img class="px" alt="">지도</button>
      <button class="sbtn" id="bMenu" type="button"><img class="px" alt="">메뉴</button>
    </div>
  </div>
  <div id="toasts" aria-live="polite"></div>
  <div class="joy" id="joy"><i id="joyKnob"></i></div>

    if (['place', 'wall', 'floor', 'ground', 'roof', 'shovel', 'food'].includes(ITEMS[r.out].kind)) { let slot = G.inv.findIndex(s => s && s.id === r.out);
      if (slot >= 6) { let to = G.inv.slice(0, 6).findIndex(x => !x); if (to < 0) to = G.sel < 6 ? G.sel : 0; const tmp = G.inv[to]; G.inv[to] = G.inv[slot]; G.inv[slot] = tmp; slot = to; }
