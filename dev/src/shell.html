<div id="game">
  <canvas id="cv" aria-label="게임 화면"></canvas><div id="vig"></div><div id="envFx"></div><button id="wearAsk" class="btn" type="button" hidden></button>
  <div id="hud">
    <div class="stat">
      <div class="top">
        <button class="face" id="face" type="button" aria-label="캐릭터"><img class="px" id="faceImg" alt=""><span class="lv" id="lvTxt">1</span><i class="xpbar"><b id="xpFill"></b></i></button>
        <div class="ring hu" id="huRing" title="배고픔"><img class="px" id="icHu" alt="배고픔"></div>
        <div class="ring env" id="envRing" title="더위·추위" hidden><img class="px" id="icEnv" alt="더위·추위"></div>
      </div>
      <div id="buffs" hidden></div>
      <button class="goal" id="goal" type="button"><b><span id="goalTag">이야기</span><i class="ql">목록 ›</i></b><span id="goalTxt">…</span></button>
    </div>
    <div id="bossbar" hidden><div class="bn">말랑대왕</div><div class="track"><div class="fill" id="bossFill"></div><i class="tk" style="left:33.3%"></i><i class="tk" style="left:66.7%"></i></div></div>

      <button class="sbtn" id="bStat" type="button"><img class="px" alt=""><span>캐릭터</span><i class="k">C</i></button>
      <button class="sbtn" id="bMap" type="button"><img class="px" alt=""><span>지도</span><i class="k">M</i></button>

      <button class="sbtn" id="bMenu" type="button"><img class="px" alt=""><span>설정</span><i class="k">Esc</i></button>
    </div>
  </div>
  <div id="toasts" aria-live="polite"></div>
  <div class="joy" id="joy"><i id="joyKnob"></i></div>
  <div id="dpad" aria-hidden="true"><i class="u"></i><i class="r"></i><i class="d"></i><i class="l"></i><b></b></div>

  <div id="pcHint">WASD 이동 · 마우스로 조준<br>클릭: 공격 · E(스페이스): 상호작용<br>R 다른 행동 · Q 다음 선택지 · Tab 도구<br>1–9 단축칸 · F·G(오른쪽 클릭) 스킬<br>C 캐릭터 · I 가방 · M 지도 · L 퀘스트</div>
  <div id="sheetWrap" hidden><div class="backdrop" id="backdrop"></div><div class="sheet" id="sheet" role="dialog"></div></div>
  <div id="bmTop" hidden><span class="bm-title">건축 중</span><button class="btn" id="bmDone" type="button">완료<i class="k"> Z</i></button></div>
  <div id="bmBar" hidden></div>
  <button id="bmRot" type="button" hidden>돌리기<i class="k"> R</i></button>
  <button id="bmPut" type="button" hidden>놓기</button>
  <div id="hurtEdge" aria-hidden="true"></div>
  <div id="fade" hidden>기절했어요…</div>
  <input type="file" id="fileIn" hidden>
  <div id="title">
    <div class="sub">작은 정원지기의 땅속 모험</div>
    <div class="logo">등불나무 아래</div>
    <div class="story">아주 깊은 땅속, 잠든 등불나무 곁에서 눈을 떴어요. 흩어진 빛씨앗 세 개를 모아 나무를 다시 깨워 주세요.</div>
    <div class="tb">
      <button class="btn" id="btnContinue" type="button" hidden>이어하기</button>
      <button class="btn ghost" id="btnCloud" type="button" style="min-height:42px;font-size:16px" hidden>☁ 클라우드에서 이어하기</button>
      <div id="cloudTitle" hidden></div>
      <button class="btn" id="btnNew" type="button">새 모험 시작</button>
      <button class="btn ghost" id="btnImport" type="button" style="min-height:38px;font-size:16px">세이브 파일 불러오기</button>
      <button class="btn ghost" id="btnBackups" type="button" style="min-height:36px;font-size:16px" hidden>백업에서 되돌리기</button>
      <div id="saveWarn" hidden></div>
    </div>
    <div id="impAsk" hidden></div>
    <div id="bkList" hidden></div>
    <div id="cloudAsk" hidden></div>
    <div id="charPick" hidden><div class="cp-h">누구와 모험할까요?</div><div class="cp-grid" id="cpGrid"></div><div class="cp-desc" id="cpDesc"></div><div class="menu-two"><button class="btn ghost" id="charBack" type="button">뒤로</button><button class="btn" id="charGo" type="button">이 친구로 시작</button></div></div>
  </div>
</div>
