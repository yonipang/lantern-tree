<title>등불나무 아래</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
<style>
/* @include style.css */
</style>

<div id="game">
  <canvas id="cv" aria-label="게임 화면"></canvas><div id="vig"></div><div id="envFx"></div><button id="wearAsk" class="btn" type="button" hidden></button>
  <div id="hud">
    <div class="bars">
      <div class="bar hp" title="체력"><img class="px" id="icHp" alt="체력"><div class="track"><div class="fill" id="hpFill"></div></div><span id="hpTxt">100</span></div>
      <div class="bar hu" title="포만감"><img class="px" id="icHu" alt="포만감"><div class="track"><div class="fill" id="huFill"></div></div><span id="huTxt">100</span></div>
      <div class="bar env" id="envBar" title="더위·추위" hidden><img class="px" id="icEnv" alt="더위·추위"><div class="track"><div class="fill" id="envFill"></div></div><span id="envTxt">0</span></div>
      <div class="bar mp" title="기력 · 경험치"><span class="lv" id="lvTxt">Lv.1</span><div class="track"><div class="fill" id="mpFill"></div><i class="xp" id="xpFill"></i></div><span id="mpTxt">40</span></div>
      <div id="buffs" hidden></div>
      <button class="goal" id="goal" type="button"><b>지금 할 일</b><span id="goalTxt">…</span></button>
      <div id="bossbar" hidden><div class="bn">말랑대왕</div><div class="track"><div class="fill" id="bossFill"></div><i class="tk" style="left:33.3%"></i><i class="tk" style="left:66.7%"></i></div></div>
    </div>
    <div class="side">
      <button class="sbtn" id="bCraft" type="button"><img class="px" alt="">제작</button>
      <button class="sbtn" id="bQuest" type="button"><img class="px" alt="">퀘스트</button>
      <button class="sbtn" id="bStat" type="button"><img class="px" alt="">능력</button>
      <button class="sbtn" id="bMap" type="button"><img class="px" alt="">지도</button>
      <button class="sbtn" id="bMenu" type="button"><img class="px" alt="">메뉴</button>
    </div>
  </div>
  <div id="toasts" aria-live="polite"></div>
  <div class="joy" id="joy"><i id="joyKnob"></i></div>
  <div id="dpad" aria-hidden="true"><i class="u"></i><i class="r"></i><i class="d"></i><i class="l"></i><b></b></div>
  <button id="actBtn" type="button" aria-label="행동"><img class="px" id="actIcon" alt=""><span id="actLbl">캐기</span></button>
  <div id="hotbar"><div id="hbSlots"></div><button class="sbtn" id="bInv" type="button" aria-label="가방"><img class="px" alt=""></button></div>
  <div id="skBar" hidden><button class="skb" type="button" data-n="0"><img class="px" alt=""><i class="cd"></i><span class="k">F</span></button><button class="skb" type="button" data-n="1"><img class="px" alt=""><i class="cd"></i><span class="k">G</span></button></div>
  <button id="rotBtn" type="button" hidden aria-label="방향 바꾸기"><b>↻</b><span>방향</span></button>
  <button id="subBtn" type="button" hidden aria-label="회수"><img class="px" id="subIcon" alt=""><span id="subLbl">회수</span></button>
  <div id="pcHint">WASD 이동 · 마우스로 조준<br>클릭 또는 스페이스: 행동<br>1–9 단축칸 · R 회수 · T 가구 방향 · I 가방(장비) · C 제작 · M 지도<br>F·G(오른쪽 클릭) 스킬 · K 능력</div>
  <div id="sheetWrap" hidden><div class="backdrop" id="backdrop"></div><div class="sheet" id="sheet" role="dialog"></div></div>
  <div id="fade" hidden>기절했어요…</div>
  <input type="file" id="fileIn" hidden>
  <div id="title">
    <div class="sub">작은 정원지기의 땅속 모험</div>
    <div class="logo">등불나무 아래</div>
    <div class="story">아주 깊은 땅속, 잠든 등불나무 곁에서 눈을 떴어요. 흩어진 빛씨앗 세 개를 모아 나무를 다시 깨워 주세요.</div>
    <div class="tb">
      <button class="btn" id="btnContinue" type="button" hidden>이어하기</button>
      <button class="btn ghost" id="btnCloud" type="button" style="min-height:52px;font-size:17px" hidden>☁ 클라우드에서 이어하기</button>
      <div id="cloudTitle" hidden></div>
      <button class="btn" id="btnNew" type="button">새 모험 시작</button>
      <button class="btn ghost" id="btnImport" type="button" style="min-height:48px;font-size:17px">세이브 파일 불러오기</button>
      <button class="btn ghost" id="btnBackups" type="button" style="min-height:44px;font-size:15px" hidden>백업에서 되돌리기</button>
      <div id="saveWarn" hidden></div>
    </div>
    <div id="impAsk" hidden></div>
    <div id="bkList" hidden></div>
    <div id="cloudAsk" hidden></div>
    <div id="charPick" hidden><div class="cp-h">누구와 모험할까요?</div><div class="cp-grid" id="cpGrid"></div><div class="cp-desc" id="cpDesc"></div><div class="menu-two"><button class="btn ghost" id="charBack" type="button">뒤로</button><button class="btn" id="charGo" type="button">이 친구로 시작</button></div></div>
    <div class="ver" id="titleHint">왼쪽을 끌어서 이동 · 오른쪽 큰 버튼으로 캐기·공격·놓기</div>
  </div>
</div>
