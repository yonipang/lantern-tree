<script>
const D = /*@@DATA*/null;
const I = D.items, $ = s => document.querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]);
const nm = id => (I[id] ? I[id].n : id);
const ico = (id, cls = '') => I[id] && I[id].icon ? `<img class="px ${cls}" src="${I[id].icon}" alt="">` : '';
const pct = p => Math.round(p * 1000) / 10 + '%';
const BIOME = D.biome;
const RAR = D.rarity.map(r => r[0]);
const WT = { sword: '검', bow: '활', dagger: '단검', spear: '창', hammer: '망치', staff: '지팡이', axe: '도끼' };
const SLOT = { body: '옷', head: '머리장식', neck: '목걸이', ring: '반지' };
const CAT = { furn: '가구', build: '건축', tool: '도구', weapon: '무기', mat: '재료', food: '요리', nature: '자연 꾸미기', circuit: '회로·전기', farm: '농사', moss: '이끼 세트', shroom: '버섯 세트', crystal: '수정 세트', ring: '반지', mine: '채굴장' };
const KINDN = { sword: '무기', pick: '곡괭이', wear: '장비', food: '음식', seed: '씨앗', mat: '재료', place: '설치물', wire: '전선', wall: '벽', floor: '바닥', ground: '땅', arrow: '화살', summon: '소환 조각상', fert: '비료', key: '열쇠 아이템', shovel: '삽', rod: '낚싯대', sickle: '낫', wcan: '물뿌리개', lasso: '올가미', recall: '귀환석' };
const GROUPS = [
  ['all', '전체', () => true],
  ['weapon', '무기', i => i.kind === 'sword'],
  ['tool', '도구', i => ['pick', 'shovel', 'rod', 'sickle', 'wcan', 'lasso', 'recall', 'fert', 'summon', 'arrow'].includes(i.kind) || i.bagUp],
  ['wear', '장비', i => i.kind === 'wear'],
  ['food', '음식', i => i.kind === 'food'],
  ['seed', '씨앗', i => i.kind === 'seed'],
  ['mat', '재료', i => (i.kind === 'mat' || i.kind === 'key') && !i.bagUp],
  ['place', '가구·설치', i => i.kind === 'place' || i.kind === 'wire'],
  ['build', '벽·바닥', i => ['wall', 'floor', 'ground'].includes(i.kind)],
];
const realItems = Object.keys(I).filter(id => !I[id].virtual);

// ---------- 얻는 곳·쓰이는 곳 색인 ----------
const MAKE = {}, USE = {}, GET = {};
const add = (m, id, v) => (m[id] = m[id] || []).push(v);
for (const r of D.recipes) { add(MAKE, r.out, r); if (!r.star) for (const [id] of r.req) if (!(USE[id] || []).some(x => x.out === r.out)) add(USE, id, r); }
const qty = (a, b) => a === b ? `${a}개` : `${a}~${b}개`;
const chance = p => p >= 1 ? '' : ` · ${pct(p)}`;
for (const k in D.walls) { const w = D.walls[k]; for (const [id, a, b, p] of w.drop) add(GET, id, { t: `「${w.n}」 캐기`, s: qty(a, b) + chance(p), go: 'world' }); }
for (const k in D.objs) { const o = D.objs[k]; for (const [id, a, b, p] of o.drops) add(GET, id, { t: `「${o.n}」`, s: qty(a, b) + chance(p), go: 'world' }); }
for (const k in D.crops) { const c = D.crops[k]; for (const [id, a, b, p] of c.yield) add(GET, id, { t: `${c.n} 작물 거두기`, s: qty(a, b) + chance(p), go: 'farm' }); }
for (const base in D.star) add(GET, D.star[base], { t: `별 작물로 거두기 (${nm(base)})`, s: '맞는 흙 · 수정골렘 처치 후', go: 'farm' });
for (const k in D.enemies) { const e = D.enemies[k]; for (const [id, a, b, p] of e.drops) add(GET, id, { t: `${e.n} 물리치기`, s: qty(a, b) + chance(p), go: 'mon' }); }
for (const k in D.bosses) { const b = D.bosses[k];
  for (const [id, c] of b.first) add(GET, id, { t: `${b.n} 첫 처치`, s: `${c}개`, go: 'boss' });
  for (const [id, c] of b.rematch) add(GET, id, { t: `${b.n} 다시 물리치기`, s: `${c}개`, go: 'boss' });
  if (b.uniq) add(GET, b.uniq, { t: `${b.n} 전용 장비`, s: '첫 처치 확정 · 재도전 35%', go: 'boss' });
  if (b.acc) add(GET, b.acc, { t: `${b.n} 장신구`, s: '첫 처치 확정 · 재도전 35%', go: 'boss' }); }
for (const b in D.catch) { const tot = D.catch[b].reduce((a, x) => a + x[1], 0); for (const [id, w] of D.catch[b]) add(GET, id, { t: `${BIOME[b]} 낚시`, s: pct(w / tot), go: 'fish' }); }
D.story.forEach((q, k) => { for (const [id, c] of q.rw) add(GET, id, { t: `이야기 퀘스트 ${k + 1} 「${q.t}」`, s: `${c}개`, go: 'quest' }); });
for (const q of D.side) for (const [id, c] of q.rw) add(GET, id, { t: `도전 퀘스트 「${q.t}」`, s: `${c}개`, go: 'quest' });
for (const k in D.animals) { const a = D.animals[k]; if (a.ranch) add(GET, a.ranch, { t: `목장의 ${a.n}`, s: `${Math.round(a.every / 60)}분마다`, go: 'animal' }); }
if (I.cryGem) add(GET, 'cryGem', { t: '「수정 결정」 캐기', s: '35% (아니면 석영)', go: 'world' });

// ---------- 그리기 도우미 ----------
const chip = (id, c) => I[id] ? `<button class="chip" data-item="${id}">${ico(id, 's')}${esc(nm(id))}${c != null ? ` <span class="x num">×${c}</span>` : ''}</button>` : `<span class="chip plain">${esc(id)}${c != null ? ` ×${c}` : ''}</span>`;
const chips = (list) => `<span class="chips">${list.map(([id, c]) => chip(id, c)).join('')}</span>`;
const dropChips = drops => `<span class="chips">${drops.map(([id, a, b, p]) => `<button class="chip" data-item="${id}">${ico(id, 's')}${esc(nm(id))} <span class="x num">${a === b ? a : a + '~' + b}${p < 1 ? ' · ' + pct(p) : ''}</span></button>`).join('')}</span>`;
const rowName = (id, sub) => `<button class="rowname" data-item="${id}">${ico(id)}<span><b class="${I[id] && I[id].rar != null ? 'r' + I[id].rar : ''}">${esc(nm(id))}</b>${sub ? `<br><small class="muted">${sub}</small>` : ''}</span></button>`;
const slot = id => `<span class="slotbox ${I[id] && I[id].rar != null ? 'rb' + I[id].rar : ''}">${ico(id)}</span>`;
const sprImg = (src, k, alt = '') => src ? `<img class="spr" data-k="${k}" src="${src}" alt="${esc(alt)}">` : '';
function sizeSprites(root) { root.querySelectorAll('img.spr').forEach(im => { const f = () => { const k = +im.dataset.k; im.style.width = im.naturalWidth * k + 'px'; im.style.height = im.naturalHeight * k + 'px'; }; im.complete ? f() : im.addEventListener('load', f, { once: true }); }); }
const kindLabel = i => i.kind === 'sword' ? (WT[i.wt] || '무기') : i.kind === 'wear' ? (SLOT[i.slot] || '장비') : i.bagUp ? '가방 늘리기' : (KINDN[i.kind] || '재료');
const stnBadge = r => `<span class="badge${r.at === 'hand' ? ' moss' : ''}">${esc(D.stn[r.at] || r.at)}</span>`;
const fmtSec = s => s >= 60 ? (s % 60 ? `${Math.floor(s / 60)}분 ${s % 60}초` : `${s / 60}분`) : `${s}초`;

R.search = q => {
  const s = q.trim().toLowerCase(); if (!s) return R.items();
  const has = t => String(t).toLowerCase().includes(s);
  const its = realItems.filter(id => has(I[id].n) || has(id));
  const mons = Object.keys(D.enemies).filter(k => has(D.enemies[k].n)), bos = Object.keys(D.bosses).filter(k => has(D.bosses[k].n));
  const qs = [...D.story.map((x, k) => [x, k + 1]), ...D.side.map(x => [x])].filter(([x]) => has(x.t) || has(x.h));
  const sks = Object.keys(D.skills).filter(k => has(D.skills[k].n));
  const total = its.length + mons.length + bos.length + qs.length + sks.length;
  return `<div class="sec-head"><h2>「${esc(q)}」 찾기</h2><p class="num">${total}개 찾았어요.</p></div>
  ${its.length ? `<div class="cat-title">아이템</div>${cardGrid(its)}` : ''}
  ${mons.length || bos.length ? `<div class="cat-title">몬스터·보스</div><div class="chips">${mons.map(k => `<a class="chip plain" href="#mon">${esc(D.enemies[k].n)}</a>`).join('')}${bos.map(k => `<a class="chip plain" href="#boss">${esc(D.bosses[k].n)}</a>`).join('')}</div>` : ''}
  ${sks.length ? `<div class="cat-title">스킬</div><div class="chips">${sks.map(k => `<a class="chip plain" href="#skill">${esc(D.skills[k].n)}</a>`).join('')}</div>` : ''}
  ${qs.length ? `<div class="cat-title">퀘스트</div><ul class="quests">${qs.map(([x, n]) => questRow(x, n)).join('')}</ul>` : ''}
  ${total ? '' : '<div class="empty">찾는 것이 없어요. 다른 이름으로 찾아보세요.</div>'}`;
};

// ---------- 아이템 상세 ----------
let trail = [];
function openItem(id, push = true) {
  const it = I[id]; if (!it) return;
  if (push) trail.push(id);
  const sh = $('#sheet'), mk = MAKE[id] || [], get = GET[id] || [], use = USE[id] || [];
  const st = [];
  if (it.dmg != null) st.push(['피해', it.dmg]); if (it.power != null) st.push(['캐는 힘', it.power]);
  if (it.food) st.push(['배 채움', it.food]); if (it.heal) st.push(['체력 회복', it.heal]);
  if (it.rar != null) st.push(['등급', `<span class="r${it.rar}">${RAR[it.rar]}</span>`]);
  if (it.slot) st.push(['장비 칸', SLOT[it.slot] || it.slot]);
  const dish = D.dishes[id] || (it.star && D.dishes[id.replace(/S$/, '')]);
  const crop = it.kind === 'seed' ? Object.values(D.crops).find(c => c.seed === id) : null;
  sh.innerHTML = `<div class="sheet-bar"><button class="icon-btn" id="sheetBack" ${trail.length > 1 ? '' : 'hidden'}>← 뒤로</button><span></span><button class="icon-btn" id="sheetClose">닫기</button></div>
    <div class="head"><span class="slotbox ${it.rar != null ? 'rb' + it.rar : ''}">${ico(id, 'l')}</span><div><span class="lbl">${esc(kindLabel(it))}</span><h2 class="${it.rar != null ? 'r' + it.rar : ''}">${esc(it.n)}</h2></div></div>
    ${it.d ? `<p class="desc">${esc(it.d)}</p>` : ''}
    ${it.buffT ? `<p class="tip"><b>버프</b> ${esc(it.buffT)}</p>` : ''}
    ${st.length ? `<div class="statgrid">${st.map(([k, v]) => `<div><small>${k}</small><b>${v}</b></div>`).join('')}</div>` : ''}
    ${crop ? `<section><span class="lbl">작물</span><div class="mini"><div>${esc(crop.n)} · ${fmtSec(crop.grow)}에 다 자람${crop.soil ? ` · 맞는 흙 ${esc(crop.soil)}` : ''}<div style="margin-top:.3rem">${dropChips(crop.yield)}</div></div></div></section>` : ''}
    ${mk.length ? `<section><span class="lbl">만드는 법</span><div class="mini">${mk.map(r => `<div>${stnBadge(r)} ${r.n > 1 ? `<small class="muted num">${r.n}개 만들어짐</small>` : ''}${r.lock ? ` <span class="badge lamp">${esc(r.lock)}</span>` : ''}<div style="margin-top:.3rem">${chips(r.req)}</div></div>`).join('')}</div></section>` : ''}
    ${dish && dish.hint && !D.known0.includes(id) ? `<section><span class="lbl">레시피 쪽지</span><p style="margin:0">${esc(dish.hint)}</p></section>` : ''}
    ${get.length ? `<section><span class="lbl">얻는 곳</span><ul>${get.map(g => `<li><a href="#${g.go}">${esc(g.t)}</a> <small class="muted num">${esc(g.s)}</small></li>`).join('')}</ul></section>` : ''}
    ${use.length ? `<section><span class="lbl">쓰이는 곳 (${use.length})</span><div class="chips">${use.map(r => chip(r.out)).join('')}</div></section>` : ''}
    ${!mk.length && !get.length && !use.length ? '<p class="note">숨은 방 보물상자나 특별한 곳에서 얻어요.</p>' : ''}`;
  sh.hidden = false; $('#sheetBg').hidden = false; sh.scrollTop = 0;
  $('#sheetClose').onclick = closeItem; $('#sheetBack').onclick = () => { trail.pop(); openItem(trail[trail.length - 1], false); };
  $('#sheetClose').focus({ preventScroll: true });
}
function closeItem() { $('#sheet').hidden = true; $('#sheetBg').hidden = true; trail = []; }

// ---------- 화면 전환 ----------
let cur = 'home';
function render() {
  const q = $('#q').value;
  $('#main').innerHTML = cur === 'search' ? R.search(q) : (R[cur] || R.home)() + `<p class="foot">${esc(D.ver || '')} 게임 데이터에서 자동으로 만든 페이지예요. 게임이 바뀌면 다시 만들어요.</p>`;
  document.querySelectorAll('#nav a').forEach(a => a.setAttribute('aria-current', a.dataset.sec === cur ? 'page' : 'false'));
  sizeSprites($('#main'));
}
function route() { const h = location.hash.slice(1); cur = R[h] && h !== 'search' ? h : 'home'; if (cur !== 'search') $('#q').value = ''; render(); window.scrollTo(0, 0); closeItem(); }
$('#nav').innerHTML = SECTIONS.map(([id, t, icon, grp]) => `${grp ? `<div class="grp lbl">${grp}</div>` : ''}<a href="#${id}" data-sec="${id}">${I[icon] ? `<img class="px" src="${I[icon].icon}" alt="">` : ''}${t}</a>`).join('');
$('#brandIcon').src = I.lightSeed.icon; $('#verLine').textContent = `${D.ver ? D.ver + ' 기준 · ' : ''}등불나무 아래 도감`;
document.addEventListener('click', e => {
  const it = e.target.closest('[data-item]'); if (it) { e.preventDefault(); if (!$('#sheet').contains(it)) trail = []; openItem(it.dataset.item); return; }
  const g = e.target.closest('[data-group]'); if (g) { itemGroup = g.dataset.group; render(); return; }
  const a = e.target.closest('[data-at]'); if (a) { craftAt = a.dataset.at; render(); return; }
  if (e.target.id === 'sheetBg') closeItem();
});
document.addEventListener('change', e => { if (e.target.id === 'starToggle') { showStar = e.target.checked; render(); } });
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeItem(); if (e.key === '/' && document.activeElement !== $('#q')) { e.preventDefault(); $('#q').focus(); } });
let qt; $('#q').addEventListener('input', () => { clearTimeout(qt); qt = setTimeout(() => { if ($('#q').value.trim()) { cur = 'search'; render(); } else { cur = 'items'; render(); } }, 120); });
addEventListener('hashchange', route);
route();
</script>
